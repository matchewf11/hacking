[package]
name = "wurl"
version = "0.1.0"
edition = "2024"

[build]
rustflags = ["-C", "reqwest_unstable"]

[profile.release]
opt-level = 3
lto = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
colored_json = "5.0.0"
reqwest = { version = "0.13.3", features = ["query"] }
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
